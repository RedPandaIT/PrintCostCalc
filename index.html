<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Print Price Calculator</title>
    <meta name="theme-color" content="#e4572e">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='21' width='24' height='6' rx='3' fill='%23e4572e'/%3E%3Crect x='7' y='13' width='18' height='6' rx='3' fill='%23ee7a3a'/%3E%3Crect x='10' y='5' width='12' height='6' rx='3' fill='%23f59e0b'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <!-- In the head so the theme is applied before the page paints (no flash). -->
    <script src="js/theme.js"></script>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <!-- Logo: three printed layers, stacked -->
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <defs>
              <linearGradient id="logo-gradient" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#e4572e"/>
                <stop offset="1" stop-color="#f59e0b"/>
              </linearGradient>
            </defs>
            <rect x="4" y="21" width="24" height="6" rx="3" fill="url(#logo-gradient)"/>
            <rect x="7" y="13" width="18" height="6" rx="3" fill="url(#logo-gradient)" opacity="0.8"/>
            <rect x="10" y="5" width="12" height="6" rx="3" fill="url(#logo-gradient)" opacity="0.6"/>
          </svg>
          <div>
            <h1>Print Price Calculator</h1>
            <p class="muted">Quotes for 3D prints</p>
          </div>
        </div>
        <button id="new-quote" class="primary">+ New quote</button>
        <h2>History</h2>
        <ul id="history" class="history"></ul>

        <h2>Backup</h2>
        <div class="backup">
          <button id="backup-download">Download backup</button>
          <button id="backup-restore">Restore from file…</button>
          <input type="file" id="backup-file" accept=".json,application/json" hidden>
          <p id="backup-status" class="muted" role="status"></p>
        </div>
      </aside>

      <main class="main">
        <div class="top">
          <button id="theme-toggle"></button>
        </div>

        <section class="panel">
          <h2>Quote</h2>
          <div id="editor"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Customer quote</h2>
            <label class="toggle"><input type="checkbox" id="show-breakdown"> Full breakdown</label>
            <button id="copy-quote">Copy quote</button>
          </div>
          <div id="quote-output" class="quote"></div>
        </section>

        <details class="panel">
          <summary>Settings &amp; filaments</summary>
          <div id="settings"></div>
        </details>
      </main>
    </div>

    <!-- Plain scripts (not ES modules) so the page also works when opened
         straight from disk. Order matters: each file uses the ones above it. -->
    <script src="js/format.js"></script>
    <script src="js/calc.js"></script>
    <script src="js/store.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/output.js"></script>
    <script src="js/history.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
